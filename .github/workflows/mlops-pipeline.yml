
name: Forages MLOps Pipeline

on:
  schedule:
    # Tous les jours à 02 h 00 au Burkina Faso
    - cron: "*/5 * * * *"
      timezone: "Africa/Ouagadougou"

  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/mlops-pipeline.yml"

permissions:
  contents: read

concurrency:
  group: forages-mlops-pipeline
  cancel-in-progress: false

jobs:
  mlops:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Vérifier Docker
        run: |
          docker --version
          docker compose version

      - name: Exécuter les tests
        run: python -m pytest -q

      - name: Construire l'image de l'API
        run: docker compose build api

      - name: Exécuter le pipeline MLOps
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db
        run: python -m src.pipeline

      - name: Publier les rapports et les résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forages-mlops-reports-${{ github.run_id }}
          path: |
            reports/automation_ledger.jsonl
            reports/drift_report.csv
            reports/monitoring_summary.json
            mlflow.db
          if-no-files-found: warn
          retention-days: 30

      - name: Arrêter les conteneurs de test
        if: always()
        run: docker compose down
